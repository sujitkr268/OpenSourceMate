name: Bug report
description: Report a bug or unexpected behavior in OpenSourceMate.
title: "[BUG]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide enough detail to help us reproduce and investigate it.

  - type: textarea
    id: summary
    attributes:
      label: Bug description
      description: Clearly describe the issue.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, browser, Python/Node versions, and relevant component.
      placeholder: OS, browser, backend/frontend, versions
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include relevant error messages or screenshots. Remove secrets and tokens.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true

  - type: checkboxes
    id: policy
    attributes:
      label: Before you start work
      options:
        - label: I have read CONTRIBUTING.md and will not write code until a maintainer assigns this issue to me
          required: true
