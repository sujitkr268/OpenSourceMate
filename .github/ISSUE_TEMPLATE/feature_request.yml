name: Feature request
description: Suggest an improvement or new feature for OpenSourceMate.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenSourceMate! Describe the problem your idea would solve and how it would help contributors.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve?
      placeholder: As a user, I want to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or improvement you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, examples, or related issues if relevant.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true

  - type: checkboxes
    id: policy
    attributes:
      label: Before you start work
      options:
        - label: I have read CONTRIBUTING.md and will not write code until a maintainer assigns this issue to me
          required: true
